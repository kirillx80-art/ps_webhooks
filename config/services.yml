services:
  # Настройки по умолчанию для всех сервисов ниже
  _defaults:
    autowire: true # зависимости подставляются автоматически по типу аргумента
    autoconfigure: true # служебные теги выставляются по типу класса
    public: true # сервис доступен из контейнера

  # Контроллеры
  PrestaShop\Module\PsWebhooks\Controller\Admin\:
    resource: "../src/Controller/Admin/"
    tags: ["controller.service_arguments"] # разрешает подставлять сервисы в аргументы методов

  # Репозиторий
  PrestaShop\Module\PsWebhooks\Repository\:
    resource: "../src/Repository/"

  # Служебные классы (подписка на хуки, отправка запросов)
  PrestaShop\Module\PsWebhooks\Service\:
    resource: "../src/Service/"
